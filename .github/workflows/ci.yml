name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: JS / TS (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test --ci

  cpp:
    name: C++ shared core (GoogleTest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build cpp/build
      - run: ctest --test-dir cpp/build --output-on-failure

  ios:
    name: iOS — SPM + Pod compat
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: corepack enable
      - run: yarn install --immutable
      - run: swift package describe
      - run: swift build --target DLScanCxx
      - run: pod lib lint DLScan.podspec --quick --allow-warnings

  android:
    name: Android — script validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Android scripts (syntax-only)
        run: |
          # Validate that required Android source files are present.
          # We can't run a real `gradle assembleDebug` from this repo because
          # the library depends on `project(":react-native-nitro-modules")`
          # which only resolves inside a consumer app's multi-project build.
          # Adding an example/ app is a follow-up workstream.

          test -f android/build.gradle
          test -f android/CMakeLists.txt
          test -f android/src/main/AndroidManifest.xml
          test -f android/src/main/java/com/margelo/nitro/dlscan/HybridDLScanAndroid.kt
          test -f android/src/main/cpp/dlscan_jni_bridge.cpp
          test -f android/src/main/assets/docaligner_lcnet100.tflite

          echo "Android scripts present. Real build requires consumer-app context (deferred to follow-up)."

  models:
    name: Model artifact integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify shipped models match models/version.json
        run: |
          # Real numerical parity is validated at export time
          # (model-training/nanodet/export_tflite/parity_check.py); CI only
          # gates that the committed artifacts are present, in sync, and
          # match the manifest.
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("models/version.json", "utf8"));
            const f = "models/" + v.fieldDetector.file;
            const size = fs.statSync(f).size;
            if (size !== v.fieldDetector.sizeBytes) {
              console.error(`size mismatch: ${f} is ${size} bytes, version.json says ${v.fieldDetector.sizeBytes}`);
              process.exit(1);
            }
            console.log(`${f} OK (${size} bytes)`);
          '
          cmp models/nanodet_field_416.tflite example/assets/nanodet_field_416.tflite
          test -f android/src/main/assets/docaligner_lcnet100.tflite
